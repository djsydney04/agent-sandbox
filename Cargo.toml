[package]
name = "codex-egress-sandbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[[bin]]
name = "sandbox"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
